name: resqmesh_ai
description: "ResQMesh AI - offline-first disaster SOS mesh application."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  geolocator: ^13.0.2
  battery_plus: ^6.2.1
  device_info_plus: ^11.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  flutter_blue_plus: ^1.35.0
  flutter_ble_peripheral: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
